services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile

    container_name: sportsnotebook_frontend

    restart: unless-stopped

    env_file: ./frontend/.env

    volumes:
      - ./frontend:/app
      - /app/node_modules

    networks:
      - app_network

    ports:
    - ${FRONTEND_PORT}:${FRONTEND_PORT}

    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    
    container_name: sportsnotebook_backend

    restart: unless-stopped

    env_file: ./backend/.env

    environment:
      - CHOKIDAR_USEPOLLING=true

    volumes:
      - ./backend:/app
      - /app/node_modules

    networks:
      - app_network

    ports:
      - ${APP_PORT}:${APP_PORT}

    depends_on:
      - activities_db
      - users_db
      - events_db

  activities_db:
    image: postgres:18

    container_name: sportsnotebook_app_activities_db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_ACTIVITIES}

    volumes:
      - activities_db_data:/var/lib/postgresql
      - ./db/init/activities:/docker-entrypoint-initdb.d

    networks:
      - app_network

    ports:
      - "${POSTGRES_DB_ACTIVITIES_PORT}:5432"

  users_db:
    image: postgres:18

    container_name: sportsnotebook_app_users_db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_USERS}

    volumes:
      - users_db_data:/var/lib/postgresql
      - ./db/init/users:/docker-entrypoint-initdb.d

    networks:
      - app_network

    ports:
      - "${POSTGRES_DB_USERS_PORT}:5432"

  events_db:
    image: postgres:18

    container_name: sportsnotebook_app_events_db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_EVENTS}

    volumes:
      - events_db_data:/var/lib/postgresql
      - ./db/init/events:/docker-entrypoint-initdb.d

    networks:
      - app_network

    ports:
      - "${POSTGRES_DB_EVENTS_PORT}:5432"

volumes:
  activities_db_data:
  users_db_data:
  events_db_data:

networks:
  app_network:
    driver: bridge

