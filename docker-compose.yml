services:
  activities_db:
    image: postgres:18

    container_name: sportsnotebook_app_activities_db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_ACTIVITIES}

    volumes:
      - activities_db_data:/var/lib/postgresql
      - ./db/init/activities:/docker-entrypoint-initdb.d

    ports:
      - "5433:5432"

volumes:
  activities_db_data: